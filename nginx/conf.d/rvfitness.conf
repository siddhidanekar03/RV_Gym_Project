# ==============================================================================
# RVFitness Production Virtual Host Configuration
# ==============================================================================
# Handles:
# 1. Port 80 HTTP-to-HTTPS permanent redirection.
# 2. Port 443 TLS 1.2/1.3 termination.
# 3. Defensive security headers and standard HSTS (without preload/subdomains).
# 4. Reverse proxying to upstream FastAPI + SPA cluster on prod-app:8000.
# 5. Direct static serving for persistent media uploads (/uploads/).
# ==============================================================================

upstream rvfitness_app_upstream {
    server prod-app:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP Ingress (Port 80) -> Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Healthcheck bypass for local Docker or load balancer HTTP probes
    location = /health {
        proxy_pass http://rvfitness_app_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Ingress (Port 443) -> TLS Termination and Upstream Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS Certificates (Mount production certificates into /etc/nginx/certs/)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS Security Policies
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Defensive Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Standard HSTS: Intentionally omits includeSubDomains and preload
    # until all organizational domains and subdomains are validated on HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Static Media Storage Mount (/uploads/)
    location /uploads/ {
        alias /var/www/rvfitness/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
        expires 30d;
        try_files $uri =404;
    }

    # Upstream Proxy to FastAPI Application & SPA Frontend
    location / {
        proxy_pass http://rvfitness_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
