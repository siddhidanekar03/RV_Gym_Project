services:
  postgres-test:
    image: postgres:16-alpine
    container_name: rvfitness_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresPassword123
      POSTGRES_DB: rvfitness_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rvfitness_test"]
      interval: 3s
      timeout: 3s
      retries: 5
