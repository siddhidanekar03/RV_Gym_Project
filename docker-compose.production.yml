# ==============================================================================
# RVFitness Production Multi-Container Compose Specification
# ==============================================================================
# Production runtime orchestration:
# 1. Ingress Reverse Proxy (Nginx) terminates TLS 1.3 on ports 80/443.
# 2. Hardened FastAPI + React 19 application running unprivileged.
# 3. Private PostgreSQL 16 database with persistent storage and no public ports.
# 4. Private Redis 7 instance with authentication and fail-closed rate limiting.
# 5. Dedicated persistent named volumes for database and uploaded media.
#
# Safety & Isolation Invariants:
# - Zero public exposure of database (5432), cache (6379), or raw app (8000).
# - Strict isolation from staging_network and test networks.
# - Credentials injected strictly via .env.production; zero hardcoded secrets.
# ==============================================================================

services:
  prod-db:
    image: postgres:16-alpine
    container_name: rvfitness_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rvf_app}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?CRITICAL: POSTGRES_PASSWORD must be provided}"
      POSTGRES_DB: ${POSTGRES_DB:-rvfitness_prod}
    volumes:
      - rvfitness_prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rvf_app} -d ${POSTGRES_DB:-rvfitness_prod}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rvfitness_prod_network

  prod-redis:
    image: redis:7-alpine
    container_name: rvfitness_prod_redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no'
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?CRITICAL: REDIS_PASSWORD must be provided}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - rvfitness_prod_network

  prod-app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: rvfitness:production
    container_name: rvfitness_prod_app
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "${DATABASE_URL:?CRITICAL: DATABASE_URL must be provided}"
      REDIS_URL: "${REDIS_URL:?CRITICAL: REDIS_URL must be provided}"
      RATE_LIMITER_BACKEND: redis
      UPLOADS_DIR: /app/uploads
      SECRET_KEY: "${SECRET_KEY:?CRITICAL: SECRET_KEY must be provided}"
      QR_SIGNING_KEY: "${QR_SIGNING_KEY:?CRITICAL: QR_SIGNING_KEY must be provided}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CRITICAL: CORS_ORIGINS must be provided}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-172.24.0.0/16,127.0.0.1}"
      TRUSTED_PROXIES: '${TRUSTED_PROXIES:-["127.0.0.1","prod-nginx"]}'
      COOKIE_SECURE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS_COUNT: ${WORKERS_COUNT:-2}
    volumes:
      - rvfitness_prod_media_data:/app/uploads
    depends_on:
      prod-db:
        condition: service_healthy
      prod-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - rvfitness_prod_network

  prod-nginx:
    image: nginx:1.27-alpine
    container_name: rvfitness_prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - rvfitness_prod_media_data:/var/www/rvfitness/uploads:ro
    depends_on:
      prod-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - rvfitness_prod_network

volumes:
  rvfitness_prod_db_data:
    name: rvfitness_prod_db_data
  rvfitness_prod_media_data:
    name: rvfitness_prod_media_data

networks:
  rvfitness_prod_network:
    name: rvfitness_prod_network
    driver: bridge
